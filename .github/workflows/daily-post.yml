name: daily-post

# 前日の夜に「翌日の開館時間」を投稿する(ストーリーは24時間表示されるため当日もカバーされる)。
# GitHubの定時実行は遅延・スキップが起きるため、夜に3回チャンスを設ける。
# output/last_posted.txt の対象日マーカーで二重投稿を防ぐ(最初に成功した1回だけ投稿)。
on:
  schedule:
    - cron: "0 14 * * *" # 23:00 JST(1回目)
    - cron: "25 14 * * *" # 23:25 JST(2回目・保険)
    - cron: "50 14 * * *" # 23:50 JST(3回目・保険)
  workflow_dispatch: # 手動実行(テスト用)
    inputs:
      dry_run:
        description: "お試し実行(SNSに投稿せず画像生成のみ)"
        type: boolean
        default: false
      day_offset:
        description: "どの日の予定を投稿するか(auto=時刻から自動判定、1=明日、0=今日)"
        default: "auto"

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 対象日が投稿済みかチェック(定時実行のみ。手動実行は常に実行)
        id: check
        run: |
          offset="${{ github.event.inputs.day_offset || 'auto' }}"
          if [ "$offset" = "auto" ]; then
            # 昼12時以降なら「明日」の予告、日付が変わった後(深夜〜午前)に
            # 遅延実行された場合は「今日」の分を投稿する
            hour=$(TZ=Asia/Tokyo date +%H)
            if [ "$hour" -ge 12 ]; then offset=1; else offset=0; fi
          fi
          target=$(TZ=Asia/Tokyo date -d "+${offset} day" +%F)
          echo "offset=$offset" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] \
             && [ -f output/last_posted.txt ] \
             && [ "$(cat output/last_posted.txt)" = "$target" ]; then
            echo "対象日($target)は投稿済みのためスキップします。"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.proceed == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: 依存関係と日本語フォントをインストール
        if: steps.check.outputs.proceed == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
          pip install -r requirements.txt

      - name: カレンダー取得と画像生成
        id: generate
        if: steps.check.outputs.proceed == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: python -m src.main generate --day-offset "${{ steps.check.outputs.offset }}"

      - name: ストーリー動画を合成(背景動画+開館時間の文字)
        id: compose
        if: steps.check.outputs.proceed == 'true'
        continue-on-error: true # 失敗しても画像投稿にフォールバックする
        run: python -m src.main compose-video

      - name: 生成画像をアップロード(お試し実行時の確認用)
        if: steps.check.outputs.proceed == 'true' && github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-image
          path: output/latest.png

      - name: 生成動画をアップロード(お試し実行時の確認用)
        if: steps.check.outputs.proceed == 'true' && github.event.inputs.dry_run == 'true' && steps.compose.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: preview-video
          path: output/story.mp4

      - name: X へ投稿
        id: post_x
        if: steps.check.outputs.proceed == 'true' && github.event.inputs.dry_run != 'true'
        continue-on-error: true # 失敗しても他の投稿は続行(要件3.5)
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python -m src.main post-x

      - name: 画像をコミット(Instagram用の公開URLを作る)
        id: commit
        if: steps.check.outputs.proceed == 'true' && github.event.inputs.dry_run != 'true'
        continue-on-error: true
        run: |
          if [ ! -f output/latest.png ]; then
            echo "画像がありません(attach_image が無効)。コミットをスキップします。"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/latest.png
          if git diff --cached --quiet; then
            echo "画像に変更なし(前回と同一)"
          else
            git commit -m "chore: 本日の開館時間画像を更新"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 動画を公開用ブランチにアップロード(履歴を持たないため肥大化しない)
        id: media
        if: steps.check.outputs.proceed == 'true' && github.event.inputs.dry_run != 'true' && steps.compose.outcome == 'success'
        continue-on-error: true
        run: |
          fname="story-$(TZ=Asia/Tokyo date +%Y%m%d-%H%M%S).mp4"
          dir=$(mktemp -d)
          cp output/story.mp4 "$dir/$fname"
          cd "$dir"
          git init -q -b media
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$fname"
          git commit -q -m "story media"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" media
          echo "url=https://raw.githubusercontent.com/${{ github.repository }}/media/$fname" >> "$GITHUB_OUTPUT"

      - name: Instagram ストーリーへ投稿(動画優先・失敗時は画像)
        id: post_ig
        if: steps.check.outputs.proceed == 'true' && github.event.inputs.dry_run != 'true' && steps.commit.outcome == 'success'
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ -n "${{ steps.media.outputs.url }}" ]; then
            python -m src.main post-instagram --video-url "${{ steps.media.outputs.url }}"
          else
            echo "動画が使えないため画像で投稿します。"
            python -m src.main post-instagram --image-url "https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.commit.outputs.sha }}/output/latest.png"
          fi

      - name: 投稿済みマーカーを記録(以降の定時実行をスキップさせる)
        id: marker
        if: steps.post_ig.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 先にリモートと同期してからマーカーを書く(逆順だと unstaged changes で失敗する)
          git pull --rebase --autostash
          echo "${{ steps.check.outputs.target }}" > output/last_posted.txt
          git add output/last_posted.txt
          git commit -m "chore: 投稿済みマーカー更新"
          git push || { git pull --rebase --autostash && git push; }

      - name: いずれかの処理が失敗していたらジョブを失敗にする(メール通知用)
        if: steps.post_x.outcome == 'failure' || steps.post_ig.outcome == 'failure' || steps.commit.outcome == 'failure' || steps.marker.outcome == 'failure'
        run: |
          echo "X: ${{ steps.post_x.outcome }} / commit: ${{ steps.commit.outcome }} / IG: ${{ steps.post_ig.outcome }} / marker: ${{ steps.marker.outcome }}"
          exit 1
