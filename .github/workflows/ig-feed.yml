name: ig-feed

# 公式サイト(gotoji-compass)に表示するInstagram最新投稿フィードの更新
# output/ig_feed/ に画像とfeed.jsonをコミットし、サイト側JSが読み込む

on:
  schedule:
    - cron: "15 23 * * *" # 毎朝 8:15 JST
  workflow_dispatch: {} # 手動実行(テスト用)

permissions:
  contents: write

concurrency:
  group: ig-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Instagram最新投稿を取得
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m src.ig_feed

      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ig_feed
          if git diff --cached --quiet; then
            echo "フィードに変更なし"
          else
            git commit -m "chore: Instagramフィードを更新"
            git push
          fi
