# ============================================================
# GOTOJI Compass 自動通知システム 設定ファイル
# 投稿文言やデザイン色はここを編集するだけで変更できます
# ============================================================

timezone: Asia/Tokyo

# --- 機能の有効/無効(段階的リリース用) ---
features:
  post_x: false         # Phase 1〜: Xへ投稿する(X APIの設定が済んだら true に)
  attach_image: true    # Phase 2〜: Xの投稿に画像を付ける
  post_instagram: true  # Phase 3〜: Instagramストーリーへ投稿する

# --- カレンダー読み取り ---
# タイトルの分類ルール(優先順位: 貸し切り > イベント > 開館)
calendar:
  keyword: 開館             # 開館時間として表示(例: 「開館」「開館(北)」)
  event_keyword: イベント    # イベント名+時間を表示(例: 「イベント:読書会」)
  reserved_keywords:        # 「この時間は一般利用できません」として表示
    - 貸し切り
    - 貸切

# --- 投稿文テンプレート ---
# 使える変数: {date} = 8/7(金) 形式, {times} = 10:00〜18:00(複数は「 / 」区切り)
post:
  open_template: "【{date}の開館時間】{times} でオープンします📍GOTOJI Compass #田川 #後藤寺"
  closed_template: "【{date}】休館日です。また次の開館日にお会いしましょう🌙 GOTOJI Compass #田川 #後藤寺"
  times_separator: " / "

# --- 画像デザイン ---
# templates/background_open.png / background_closed.png を置くと
# その画像を背景として使います(1080x1920推奨)。無ければ単色背景。
image:
  width: 1080
  height: 1920
  open:
    background: "#1B2A4A"   # 開館日の背景色(濃紺)
    text: "#FFFFFF"
    accent: "#F5A623"       # 時刻などの強調色(アンバー)
  closed:
    background: "#3A3A3A"   # 休館日の背景色(グレー)
    text: "#EEEEEE"
    accent: "#9AA7B8"
  title: "GOTOJI Compass"
  subtitle: "コミュニティスペース(福岡県田川市・後藤寺)"
  # 前夜に翌日分を投稿するため「本日」とは書かず、上に表示される日付で伝える
  open_label: 開館時間
  closed_label: 休館日
  closed_message: また次の開館日にお会いしましょう
  event_label: イベント
  reserved_label: 貸し切り
  reserved_note: この時間は一般利用できません
  no_regular_open: 通常開館はありません
  # 動画背景のときに文字を読みやすくする暗幕の濃さ(0=なし〜1=真っ黒)
  video_scrim: 0.4
  # フォントを固定したい場合はパスを指定(空なら自動検出)
  font_path: ""
