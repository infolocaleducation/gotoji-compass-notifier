# ============================================================
# GOTOJI Compass 自動通知システム 設定ファイル
# 投稿文言やデザイン色はここを編集するだけで変更できます
# ============================================================

timezone: Asia/Tokyo

# --- 機能の有効/無効(段階的リリース用) ---
features:
  post_x: false         # Phase 1〜: Xへ投稿する(X APIの設定が済んだら true に)
  attach_image: true    # Phase 2〜: Xの投稿に画像を付ける
  post_instagram: true  # Phase 3〜: Instagramストーリーへ投稿する

# --- カレンダー読み取り ---
calendar:
  keyword: 開館   # タイトルにこの文字を含む予定を「開館時間」として扱う

# --- 投稿文テンプレート ---
# 使える変数: {date} = 8/7(金) 形式, {times} = 10:00〜18:00(複数は「 / 」区切り)
post:
  open_template: "【本日の開館時間】{date} {times} でオープンしています📍GOTOJI Compass #田川 #後藤寺"
  closed_template: "【本日休館】{date} 本日はお休みです。また次の開館日にお会いしましょう🌙 GOTOJI Compass #田川 #後藤寺"
  times_separator: " / "

# --- 画像デザイン ---
# templates/background_open.png / background_closed.png を置くと
# その画像を背景として使います(1080x1920推奨)。無ければ単色背景。
image:
  width: 1080
  height: 1920
  open:
    background: "#1B2A4A"   # 開館日の背景色(濃紺)
    text: "#FFFFFF"
    accent: "#F5A623"       # 時刻などの強調色(アンバー)
  closed:
    background: "#3A3A3A"   # 休館日の背景色(グレー)
    text: "#EEEEEE"
    accent: "#9AA7B8"
  title: "GOTOJI Compass"
  subtitle: "コミュニティスペース(福岡県田川市・後藤寺)"
  open_label: 本日の開館時間
  closed_label: 本日休館
  closed_message: また次の開館日にお会いしましょう
  # フォントを固定したい場合はパスを指定(空なら自動検出)
  font_path: ""
